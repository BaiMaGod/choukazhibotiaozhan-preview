<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稀有卡演出验收</title><style>body{margin:0;background:#201626;color:#fbeaff;font:14px system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;padding:8px}button{padding:6px 10px}iframe{display:block;border:0;width:390px;height:844px}p{margin:6px 8px}</style></head><body><nav><button data-size="390,844">390×844</button><button data-size="360,640">360×640</button><button data-fx="1">新版演出</button><button data-fx="0">旧版对照</button></nav><p>固定五级样包 · 正常速度 · 仅用于演出验收</p><iframe title="固定五级样包" id="game" src="./?demo=1&v=show-v3"></iframe><script>const frame=document.querySelector('#game');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px'});document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{frame.src='./?demo=1&v=show-v3&rarityFx='+b.dataset.fx});</script></body></html>
