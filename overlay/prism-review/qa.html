<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PRISM 竖屏验收</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1920;color:#fff;font:14px system-ui}nav{height:42px;display:flex;gap:8px;align-items:center;padding:6px}button{padding:4px 10px}iframe{display:block;border:0;background:#241b22;width:390px;height:844px;margin:0}label{margin-left:12px}</style><nav><button data-size="360,640">360×640</button><button data-size="390,844">390×844</button><button data-size="941,1672">941×1672</button><button data-mode="demo">固定五级样包</button><button data-mode="game">真实游戏</button><label id="info">390×844</label></nav><iframe id="game" title="真实游戏构建" src="./?demo=1&build=9ea24cd6"></iframe><script>const game=document.querySelector('#game');document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const [w,h]=button.dataset.size.split(',');game.style.width=w+'px';game.style.height=h+'px';document.querySelector('#info').textContent=w+'×'+h;});document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{game.src=button.dataset.mode==='demo'?'./?demo=1&build=9ea24cd6':'./?build=9ea24cd6';});</script></html>
