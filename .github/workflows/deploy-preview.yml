name: Deploy browser preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bundle/**'
      - 'overlay/**'
      - '.github/workflows/deploy-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: browser-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack browser build
        run: |
          cat bundle/part-*.bin > "${RUNNER_TEMP}/preview.tar.gz"
          (cd "${RUNNER_TEMP}" && sha256sum --check "${GITHUB_WORKSPACE}/bundle/SHA256SUMS")
          python3 - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path
          allowed = {'.js', '.css', '.html', '.txt', '.webp', '.json'}
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'preview.tar.gz') as archive:
              for entry in archive.getmembers():
                  if entry.isdir():
                      continue
                  name = Path(entry.name)
                  if not entry.isfile() or name.is_absolute() or '..' in name.parts or (
                      name.suffix not in allowed and name.as_posix() != 'SHA256SUMS'
                  ):
                      raise SystemExit(f'Unexpected preview entry: {entry.name}')
              archive.extractall('public', filter='data')
          build = json.loads(Path('public/build-info.json').read_text())
          assert build['target'] == 'browser-preview'
          assert len(list(Path('public/assets/art').rglob('*.webp'))) == 147
          assert '"requireCloud": false' in Path('public/js/generated-rules.js').read_text()
          PY
          (cd public && sha256sum --check --quiet SHA256SUMS)
          test -s public/index.html
          test -s public/libs/laya.core.js
      - name: Apply verified auto-reveal update
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          manifest = json.loads(Path('overlay/manifest.json').read_text())
          for name, digest in manifest['files'].items():
              source = Path('overlay') / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
              target = Path('public') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          Path('public/build-info.json').write_text(json.dumps({'target':'browser-preview','source_branch':'main','source_commit':manifest['source_commit']}))
          files = sorted(p for p in Path('public').rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          Path('public/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to('public').as_posix() + '\n' for p in files))
          PY
          (cd public && sha256sum --check --quiet SHA256SUMS)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy verified preview
        id: deploy
        uses: actions/deploy-pages@v4
